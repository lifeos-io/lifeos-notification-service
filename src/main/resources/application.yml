spring:
  application:
    name: lifeos-notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notification}
    username: ${DB_USERNAME:notification}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    # Locally Mailpit (lifeos-infra/local): catches every message, sends nothing out.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  messages:
    basename: messages
    encoding: UTF-8
    # A language without its own file falls back to messages.properties (Turkish), not to the server's locale.
    fallback-to-system-locale: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # A new consumer group (first deployment) starts from the oldest event.
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          # Inner security layer: the service validates the JWT itself (lifeos-base-web).
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/lifeos}
          # Keycloak must add this audience to access tokens (audience mapper on the lifeos realm).
          audiences: ${JWT_AUDIENCES:lifeos-api}

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    mail:
      # A mail outage must not take the service out of rotation: deliveries are retried on their own.
      enabled: false

lifeos:
  messaging:
    outbox:
      enabled: false        # consumes events only, publishes none
    inbox:
      consumer: notification
  notification:
    strategy-topic: lifeos.strategy.events.v1
    trigger-topic: lifeos.trigger.events.v1
    coach-topic: lifeos.coach.events.v1
    mail:
      from: ${MAIL_FROM:Life OS <no-reply@lifeos.local>}
    sender:
      interval-ms: 30000            # how often due deliveries are looked for
      initial-delay-ms: 10000
